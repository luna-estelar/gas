<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GAS listening check</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 2rem;
        max-width: 48rem;
      }
      label {
        display: block;
        margin: 0.5rem 0;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        height: 24rem;
        overflow: auto;
      }
      #summary {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>GAS listening check (LE-89)</h1>
    <p>
      Plays <code>examples/documents/drum-loop.gas</code> through the Lyria connector. The key stays
      in this page's memory and is never stored.
    </p>
    <label>Gemini API key <input id="key" type="password" autocomplete="off" size="48" /></label>
    <label>
      Output sample rate
      <select id="rate">
        <option value="">device default</option>
        <option value="44100">44 100 Hz</option>
        <option value="48000">48 000 Hz</option>
      </select>
    </label>
    <button id="play">Play</button>
    <button id="stop" disabled>Stop</button>
    <p id="summary"></p>
    <pre id="log"></pre>
    <script type="module" src="./listen.mjs"></script>
  </body>
</html>
