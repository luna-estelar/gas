version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain rather than five. These move together and are
      # verified by the same gate.
      dev-tooling:
        patterns:
          - '@types/*'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - 'publint'
          - '@arethetypeswrong/*'
    ignore:
      # langium and langium-cli must stay on the same minor: langium-cli
      # generates the parser that langium runs. Bump them together, by hand.
      - dependency-name: 'langium'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'langium-cli'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Langium 4.2 requires chevrotain 12. Move it when Langium does.
      - dependency-name: 'chevrotain'
        update-types: ['version-update:semver-major']
      # TypeScript 7 ships no stable compiler API, which the browser boundary
      # tests parse source with. Stay on 6 until they move off it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Typings track the oldest supported Node (engines), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
