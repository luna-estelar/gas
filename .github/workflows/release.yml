name: Release

on:
  workflow_dispatch:

# Serialize publication and tag recovery.
concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Push package tags after npm verification.
      contents: write
      # Allow npm provenance attestations.
      id-token: write
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2

      # No dependency cache: this job can publish, so it never restores state
      # another workflow could have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Require prepared versions
        run: |
          node --input-type=module <<'JS'
          import { readdir, readFile } from 'node:fs/promises';
          const pending = (await readdir('.changeset')).filter(
            (file) => file.endsWith('.md') && file !== 'README.md'
          );
          if (pending.length) throw new Error(`Run pnpm version-packages first: ${pending.join(', ')}`);
          const pre = await readFile('.changeset/pre.json', 'utf8').catch((error) => {
            if (error.code === 'ENOENT') return 'null';
            throw error;
          });
          if (JSON.parse(pre)?.mode === 'pre') throw new Error('Exit prerelease mode before release.');
          JS
          node scripts/sync-versions.mjs --check

      - name: Audit production dependencies
        run: pnpm check:security

      - name: Build, check and test
        run: pnpm test

      - name: Publish missing versions
        run: pnpm changeset publish --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: true

      # Check all public manifest versions, even when publication was a no-op.
      - name: Verify provenance
        run: node scripts/check-provenance.mjs

      - name: Create and push package tags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm changeset git-tag
          git push origin --tags
