# Release through Changesets. While changesets are pending on main, this opens
# or updates the Version Packages PR. Merging that PR publishes every package
# whose version is not yet on npm, in workspace dependency order, and creates a
# tag and GitHub release per package. Publication is not transactional: rerun
# the workflow after an interrupted publish and it skips versions already out.
name: Release

on:
  push:
    branches: [main]

# Two overlapping runs would race on the Version Packages branch and on npm.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Push the version commit, tags and GitHub releases.
      contents: write
      # Open and update the Version Packages PR.
      pull-requests: write
      # Allow npm provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2

      # No dependency cache: this job can publish, so it never restores state
      # another workflow could have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm check:security

      - name: Build, check and test
        run: pnpm test

      - name: Version or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm changeset publish
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `changeset publish` runs `pnpm publish` without a provenance flag, so
          # the setting comes from the environment. pnpm 11 reads only
          # PNPM_CONFIG_*; NPM_CONFIG_PROVENANCE was ignored and the 0.2.0
          # release went out without attestations.
          PNPM_CONFIG_PROVENANCE: true

      # A missing attestation does not fail the publish, so check for one.
      - name: Verify provenance
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/check-provenance.mjs
